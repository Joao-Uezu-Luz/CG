<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bresenham - Linhas e Triângulos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        
        canvas {
            border: 2px solid #444;
            border-radius: 8px;
            cursor: crosshair;
            background: #0a0a0a;
        }
        
        .info {
            margin-top: 20px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
            background: #222;
            padding: 15px 25px;
            border-radius: 8px;
            min-width: 500px;
        }
        
        .info p {
            margin: 6px 0;
        }
        
        .info span {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .mode-active {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .mode-inactive {
            color: #666;
        }
        
        .coord-value {
            color: #4CAF50;
            font-family: 'Courier New', monospace;
        }
        
        .keys {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        
        .key {
            display: inline-block;
            padding: 3px 10px;
            background: #333;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid #555;
        }
        
        .key-preview {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            vertical-align: middle;
            margin: 0 4px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <canvas id="canvas" width="800" height="600"></canvas>

    <div class="info">
        <div>
            🎯 Modo atual: <span id="modeDisplay" class="mode-active">LINHA</span>
        </div>
        <div style="font-size: 12px; color: #888; margin: 4px 0;">
            <span class="key">R</span> Modo Linha | 
            <span class="key">T</span> Modo Triângulo |
            <span class="key">0-9</span> Cores
        </div>
        
        <div class="keys" id="colorKeys"></div>
        
        <p id="coordInfo">
            <span class="coord-value">Clique para definir os pontos</span>
        </p>
        
        <div style="margin-top: 6px; font-size: 12px; color: #666;">
            Cor atual: <span id="colorName" style="color: #0066ff;">Azul</span>
            <span id="progressInfo"></span>
        </div>
    </div>

    <script src="main.js"></script>

</body>
</html>
