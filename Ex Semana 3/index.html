<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pong</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Courier New', monospace;
        }
        #gameContainer {
            position: relative;
            display: inline-block;
        }
        canvas {
            display: block;
            border: 2px solid #333;
            background: #111;
        }
        #placar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            pointer-events: none;
            user-select: none;
        }
        #mensagem {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 32px;
            text-align: center;
            pointer-events: none;
            user-select: none;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        #mensagem .sub {
            font-size: 18px;
            opacity: 0.7;
            margin-top: 15px;
        }
        #instrucoes {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas" width="800" height="600"></canvas>
        <div id="placar">0 - 0</div>
        <div id="mensagem">
            PONG
            <div class="sub">Pressione ESPAÇO para começar</div>
        </div>
        <div id="instrucoes">Jogador 1: W/S | Jogador 2: ↑/↓</div>
    </div>
    <script src="m3.js"></script>
    <script src="main.js"></script>
</body>
</html>
